name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build app
        run: |
          xcodebuild build \
            -project SingersLyrics.xcodeproj \
            -scheme SingersLyrics \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/DerivedData/Build/Products/Debug/Singers Lyrics.app" \
            "$RUNNER_TEMP/Singers-Lyrics-macOS.zip"

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: Singers-Lyrics-macOS-Debug
          path: ${{ runner.temp }}/Singers-Lyrics-macOS.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
